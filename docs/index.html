      <script type="text/javascript">
        const toggle = id => {

      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

      <script type="text/javascript">
        const createChart = (canvas, data, units) => {
          const values = data.map(({ value }) => value);
          const padding = Math.round((Math.max(...values) - Math.min(...values)) / 10);

          new Chart(canvas, {
            type: 'line',
            data: {
              labels: data.map(({timestamp}) => new Date(timestamp)),
              datasets: [{
                data: values,
                borderWidth: 3,
                lineTension: 0.3
              }]
            },

            options: {
              plugins: {
                legend: {
                  display: false
                },
              },
              responsive:true,
              aspectRatio: 4,
              scales: {
                x: { type: "timeseries" },
                y: {
                  min: Math.min(...data.map(({ value }) => value)) - padding,
                  max: Math.max(...data.map(({ value }) => value)) + padding,
                  ticks: {
                    callback: label => `${label} ${units}`,
                  }
                }
              }
            }
          });
        }
      </script>
